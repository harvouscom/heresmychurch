# Legacy map URLs (still rewritten for bots until caches clear)
[[edge_functions]]
  function = "og-rewrite"
  path = "/state/*"
[[edge_functions]]
  function = "og-rewrite"
  path = "/country/*"

[[edge_functions]]
  function = "og-rewrite"
  path = "/report/*"

[[edge_functions]]
  function = "og-rewrite"
  path = "/reports"

[[edge_functions]]
  function = "og-rewrite"
  path = "/metro"
[[edge_functions]]
  function = "og-rewrite"
  path = "/metro/*"

# Canonical map paths: /state/* → /US/*, /country/CC/* → /CC/*
[[redirects]]
  from = "/state/*"
  to = "/US/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/country/:code"
  to = "/:code"
  status = 301
  force = true

[[redirects]]
  from = "/country/:code/*"
  to = "/:code/:splat"
  status = 301
  force = true
