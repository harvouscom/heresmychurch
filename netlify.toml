# Netlify configuration
# See https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "dist"
  command = "pnpm run build"

# Edge function: inject detected country (+ US state) into HTML for landing (uses context.geo)
[[edge_functions]]
  function = "geo-inject"
  path = "/*"

# Edge function: rewrite HTML meta tags for social crawlers so they get per-page OG images.
# Paths cover all supported map countries (see intl-country-meta) plus reports + metro SEO pages.
[[edge_functions]]
  function = "og-rewrite"
  path = "/world"

[[edge_functions]]
  function = "og-rewrite"
  path = "/US"
[[edge_functions]]
  function = "og-rewrite"
  path = "/US/*"
[[edge_functions]]
  function = "og-rewrite"
  path = "/CA"
[[edge_functions]]
