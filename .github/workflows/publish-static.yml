name: Republish static files

on:
  # Daily publishing now runs inside Cloudflare; retain this manual recovery action.
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Republish states.json and churches/{REGION}.json to R2
        env:
          MODERATOR_KEY: ${{ secrets.MODERATOR_KEY }}
        run: node scripts/publish-static.mjs
